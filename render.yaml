# Render Blueprint for the FastAPI backend — https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> it reads
# this file automatically. The `sync: false` env vars are prompted for once
# at setup time and kept only in Render's dashboard (never committed here).
#
# Persistence: SQLite lives on the attached disk at /data, not the repo —
# `DB_PATH` below points backend/app/config.py at it. Without this disk, an
# ordinary Render web service filesystem is wiped on every deploy/restart,
# which would silently lose every project/house.
services:
  - type: web
    name: ssk-cat-workspace-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_PATH
        value: /data/bom_backend.db
      # Comma-separated list of frontend origins allowed to call this API —
      # set to your Vercel deployment URL(s), e.g.
      # https://your-app.vercel.app,https://your-custom-domain.com
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: bom-data
      mountPath: /data
      sizeGB: 1
